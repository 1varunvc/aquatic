name: Update Homebrew Tap

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-tap:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload source tarball as release asset
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="aquatic-${VERSION}.tar.gz"
          ASSET_URL="https://github.com/1varunvc/aquatic/releases/download/${GITHUB_REF_NAME}/${TARBALL}"

          curl -sL "https://github.com/1varunvc/aquatic/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" -o "$TARBALL"
          gh release upload "${GITHUB_REF_NAME}" "$TARBALL" --clobber

          SHA=$(shasum -a 256 "$TARBALL" | awk '{print $1}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "[INFO] Version: $VERSION | SHA256: $SHA"
          echo "[INFO] Asset URL: $ASSET_URL"

      - name: Update tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${TAP_TOKEN}@github.com/1varunvc/homebrew-aquatic.git tap
          cd tap

          sed -i '' \
            -e 's|url ".*"|url "${{ steps.upload.outputs.asset_url }}"|' \
            -e 's|sha256 ".*"|sha256 "${{ steps.upload.outputs.sha256 }}"|' \
            -e 's|version ".*"|version "${{ steps.upload.outputs.version }}"|' \
            Formula/aquatic.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aquatic.rb
          git commit -m "bump: aquatic ${{ steps.upload.outputs.version }}"
          git push origin main

